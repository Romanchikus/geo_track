[project]
name = "geo-track"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "canary_tests",
    "services/api",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services/api/tests"]
pythonpath = ["services/api", "."]
markers = [
    "integration: tests that need a database",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["services/api"]
force-exclude = true
extend-exclude = ["wire/telemetry_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "canary_tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "services/api:."
explicit_package_bases = true
namespace_packages = true
files = ["services/api/app", "services/api/tests", "services/api/alembic"]
exclude = ["services/api/alembic/versions"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "asyncpg", "asyncpg.*", "rstream", "rstream.*", "shapely.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
